# Вход для устройств Hbox из интернета: TLS со своим сертификатом (deploy/tls), дальше HTTP
# на сервер Hbox. В облачном файрволе Hetzner открыт только 18443 — он и проброшен сюда.
log_format traffic '$remote_addr [$time_local] "$request" $status req=$request_length sent=$bytes_sent $request_time';

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    # TLS 1.2 нужен модему ML307R
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:tls:1m;
    ssl_session_timeout 4h;
    keepalive_timeout 120s;
    server_tokens off;
    # info: видны неудачные TLS-рукопожатия модема
    error_log /dev/stderr info;
    access_log /dev/stdout traffic;

    location /hbox/ {
        proxy_pass http://speedtest:8000;
        proxy_set_header X-Real-IP $remote_addr;
        # тело идёт потоком, без буфера на диске; часовой файл ~60 МБ
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        client_body_timeout 120s;
        client_max_body_size 0;
    }
    location / { return 404; }
}
