# Прошивка ESP32-S3 SuperMini (ESP-IDF). В артефактах: bootloader.bin (0x0), partition-table.bin (0x8000),
# hbox.bin (0x10000, слот ota_0), ota_data_initial.bin (0x3D0000 — загрузка с ota_0). Не одним файлом с 0x0:
# тот затёр бы NVS (0x9000) с токеном устройства. hbox.bin же загружается на сайт для обновления по воздуху.
name: firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # релиз fw-<версия>: сайт ставит hbox.bin отсюда, zip — для прошивки по USB
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          docker run --rm -v "$PWD:/w" -w /w/firmware -e HBOX_VERSION="${GITHUB_SHA::7}" espressif/idf:v5.5.1 sh -c '
            idf.py set-target esp32s3 build &&
            cp build/bootloader/bootloader.bin build/partition_table/partition-table.bin build/ota_data_initial.bin /w/ &&
            cp build/hbox.bin /w/hbox.bin'
          ls -l bootloader.bin partition-table.bin ota_data_initial.bin hbox.bin

      - uses: actions/upload-artifact@v4
        with:
          name: hbox-firmware
          path: |
            bootloader.bin
            partition-table.bin
            ota_data_initial.bin
            hbox.bin
          retention-days: 30

      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_SHA::7}"
          mkdir pkg
          cp bootloader.bin partition-table.bin ota_data_initial.bin hbox.bin pcclient/monitor.py pcclient/requirements.txt pkg/
          for f in pcclient/*.bat pcclient/README.txt; do sed 's/\r*$/\r/' "$f" > "pkg/$(basename "$f")"; done
          (cd pkg && zip -q "../hbox-firmware-$V.zip" *)
          gh release create "fw-$V" hbox.bin "hbox-firmware-$V.zip" --target "$GITHUB_SHA" \
            --title "$V: $(git log -1 --format=%s)" \
            --notes "Обновление по воздуху: сайт → устройство → Прошивка → Установить. По USB: распаковать zip, esp_flash.bat."
