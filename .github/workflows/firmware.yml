# Прошивка ESP32-S3 SuperMini (ESP-IDF). В артефактах: bootloader.bin (0x0), partition-table.bin (0x8000),
# hbox.bin (0x10000). Не одним файлом с 0x0: тот затёр бы NVS (0x9000) с токеном устройства.
name: firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          docker run --rm -v "$PWD:/w" -w /w/firmware espressif/idf:v5.5.1 sh -c '
            idf.py set-target esp32s3 build &&
            cp build/bootloader/bootloader.bin build/partition_table/partition-table.bin /w/ &&
            cp build/hbox.bin /w/hbox.bin'
          ls -l bootloader.bin partition-table.bin hbox.bin

      - uses: actions/upload-artifact@v4
        with:
          name: hbox-firmware
          path: |
            bootloader.bin
            partition-table.bin
            hbox.bin
          retention-days: 30
