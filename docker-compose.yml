# Сервер Hbox на Hetzner 178.104.149.56. Снаружи открыт только 18443 (облачный файрвол):
# там nginx снимает TLS и отдаёт /hbox/ серверу. Ключи TLS — deploy/tls/, токены — .env (не в git).
# Сайт для людей — https://hbox.fabtech.uz через Cloudflare Tunnel (только /hbox/admin; токен туннеля —
# deploy/tunnel.env, не в git). Устройства ходят напрямую на 18443: там наш CA, Cloudflare не нужен.
services:
  proxy:
    image: nginx:alpine
    depends_on: [server]
    ports:
      - "18443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./deploy/tls/server.key:/etc/nginx/tls/server.key:ro
    restart: unless-stopped
    logging:
      options:
        max-size: "5m"

  server:
    build: server
    image: hbox-server:dev
    env_file: .env
    environment:
      HBOX_DATA: /data
    volumes:
      - ./data:/data
    restart: unless-stopped
    logging:
      options:
        max-size: "5m"

  tunnel:
    image: cloudflare/cloudflared:2025.9.1
    depends_on: [server]
    command: tunnel --no-autoupdate run
    env_file: deploy/tunnel.env
    restart: unless-stopped
    logging:
      options:
        max-size: "5m"
