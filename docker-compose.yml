# Сервер Hbox на Hetzner 178.104.149.56. Снаружи открыт только 18443 (облачный файрвол):
# там nginx снимает TLS и отдаёт /hbox/ серверу. Ключи TLS — deploy/tls/, токены — .env (не в git).
services:
  proxy:
    image: nginx:alpine
    depends_on: [server]
    ports:
      - "18443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./deploy/tls/server.key:/etc/nginx/tls/server.key:ro
    restart: unless-stopped
    logging:
      options:
        max-size: "5m"

  server:
    build: server
    image: hbox-server:dev
    env_file: .env
    environment:
      HBOX_DATA: /data
    volumes:
      - ./data:/data
    restart: unless-stopped
    logging:
      options:
        max-size: "5m"
